name: POC verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Driver protocol and failure classification
        run: python3 -m unittest discover -s benchmark/tests -v
      - name: Record optional public CI model credential readiness
        env:
          MODEL_API_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          mkdir -p reports
          python3 scripts/model_access.py --ci

      - run: mkdir -p bin reports && go build -o bin/appctl ./cmd/appctl
      - name: Check policy, compiled RLS, and locked migrations
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bin/appctl verify --base '${{ github.event.pull_request.base.sha }}'
          else
            bin/appctl verify
          fi
      - name: Adversarial verifier probes
        run: python3 tests/verifier.py | tee reports/verifier.json
        shell: bash
      - name: Extension verifier rule controls on real cohort exports (no model calls)
        run: python3 tests/extension_controls.py | tee reports/extension-controls.json
        shell: bash
      - name: Extension verifier interception on archived v4/v4b/v5/v5b candidates (no model calls)
        run: python3 research/verifier_extension_rules.py --out reports/verifier-extension-rules
      - name: Catalog-bound operation verifier controls on v6 and platform exports (no model calls)
        run: python3 tests/operation_controls.py | tee reports/operation-controls.json
        shell: bash
      - name: Catalog-bound verifier retrospective replay on 228 archived v6 candidates (not out-of-sample)
        run: python3 research/operation_semantics_replay.py --out reports/operation-semantics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-results
          path: reports/
  runtime:
    strategy:
      fail-fast: false
      matrix:
        route: [baseline, guarded, zenstack]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_agent_poc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/enterprise_agent_poc
      DATABASE_URL: postgres://app_runtime:poc-only@127.0.0.1:5432/enterprise_agent_poc
      POC_DB_RESET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: |
            apps/zenstack/package-lock.json
            apps/web/package-lock.json
      - run: npm ci --prefix apps/zenstack
      - run: npm run generate --prefix apps/zenstack && npm run typecheck --prefix apps/zenstack
      - run: mkdir -p bin && go build -o bin/server ./cmd/server
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install Chromium for browser acceptance
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Shared acceptance and controlled fault injection
        run: python3 scripts/experiment.py --route '${{ matrix.route }}'
      - name: Benchmark evaluator smoke controls (synthetic only)
        if: matrix.route == 'baseline'
        run: python3 benchmark/smoke.py | tee reports/benchmark-smoke.json
        shell: bash
      - name: Model runner end-to-end controls (synthetic only)
        if: matrix.route == 'baseline'
        run: python3 benchmark/runner_smoke.py | tee reports/runner-smoke.json
        shell: bash
      - name: Audit PR 7 archive and replay generated candidates (no model calls)
        if: matrix.route == 'baseline'
        run: |
          python3 research/audit_pilot.py
          python3 research/replay_followup.py
      - name: Four-cell atomic bulk approval controls (no model calls)
        if: matrix.route == 'baseline'
        run: |
          python3 benchmark/phase2/smoke.py
          python3 benchmark/phase2/driver_smoke.py
      - name: Audit PR 10 archive and replay four candidates on new fixtures
        if: matrix.route == 'baseline'
        run: |
          python3 research/audit_atomic_pilot.py
          python3 research/replay_atomic_pilot.py
      - name: Transactional Action, audit and idempotency controls (no model calls)
        if: matrix.route == 'baseline'
        run: python3 benchmark/phase3/smoke.py
      - name: Action evolution cohort and standalone generation kit controls (no model calls)
        if: matrix.route == 'baseline'
        run: python3 benchmark/phase3/driver_smoke.py
      - name: Shared Next.js production UI and browser acceptance
        run: python3 scripts/browser.py --route '${{ matrix.route }}'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.route }}
          path: reports/
  cohort-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_agent_poc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/enterprise_agent_poc
      DATABASE_URL: postgres://app_runtime:poc-only@127.0.0.1:5432/enterprise_agent_poc
      POC_DB_RESET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: apps/zenstack/package-lock.json
      # db.mjs imports pg from apps/zenstack/node_modules.
      - run: npm ci --prefix apps/zenstack
      - name: v4 implicit-convention controls (real PostgreSQL, fake Kiro, no model calls)
        run: python3 benchmark/phase4/driver_smoke.py
      - name: v5 scattered-convention controls (real PostgreSQL, fake Kiro, no model calls)
        run: python3 benchmark/phase5/driver_smoke.py
      - name: v5b required-event controls (real PostgreSQL, fake Kiro, no model calls)
        run: python3 benchmark/phase5b/driver_smoke.py
      - name: v6a countersign controls (real PostgreSQL, fake Kiro, no model calls)
        run: python3 benchmark/phase6a/driver_smoke.py
      - name: v6b reassignment controls (real PostgreSQL, fake Kiro, no model calls)
        run: python3 benchmark/phase6b/driver_smoke.py
      - name: Catalog kernel (opkernel) on PostgreSQL, all catalog entries
        env:
          POC_REQUIRE_DB: '1'
        run: |
          mkdir -p reports
          go test -race -count=1 -v ./internal/opkernel/ | tee reports/opkernel-db.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cohort-controls
          path: reports/
  oracle-resume-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply oracle patch to pinned v9 and run no-model resume controls
        run: python3 scripts/oracle_resume_controls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-resume-controls
          path: reports/
  report:
    if: always()
    needs: [verifier, runtime, cohort-controls, oracle-resume-controls]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true
      - run: python3 scripts/report.py reports | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-comparison
          path: reports/
